name: Deploy site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Unzip site
        run: unzip -o site.zip -d _site

      - name: Inject Supabase settings
        run: >
          sed -i
          "s|__SUPABASE_URL__|${{ secrets.SUPABASE_URL }}|g;
          s|__SUPABASE_ANON_KEY__|${{ secrets.SUPABASE_ANON_KEY }}|g"
          _site/config.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
